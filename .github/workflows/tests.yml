name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Rebuild the published certificate from stored traces
        # No API key, no network. If the committed evidence stops reproducing
        # the published numbers, this fails and the claim is retracted by CI.
        run: |
          plumbline certify runs/parity-study --arm react
          plumbline parity  runs/parity-study plan_execute react
