[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name; the import package and CLI are both `plumbline`.
# (The bare name `plumbline` on PyPI belongs to an unrelated project.)
name = "plumbline-harness"
version = "0.3.0"
description = "Conformance-under-perturbation testing for LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bhargav Raghavendra" }]
dependencies = []

[project.optional-dependencies]
# The adapter passes cache_control as a top-level messages.create parameter,
# which exists from the 1.x SDK onward -- an older floor would import fine
# and fail at the first call.
anthropic = ["anthropic>=1.0"]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7.4", "ruff", "anthropic>=1.0", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
plumbline = "plumbline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts that must shim sys.path before importing the package.
"experiments/**" = ["E402"]
"docs/*.py" = ["E402"]
