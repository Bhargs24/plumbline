[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbline"
version = "0.2.0"
description = "Conformance-under-perturbation testing for LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bhargav Raghavendra" }]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
report = ["jinja2>=3.1"]
dev = ["pytest>=7.4", "anthropic>=0.40"]

[project.scripts]
plumbline = "plumbline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
